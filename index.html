<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Special Relativity Simulation</title><style>body{margin:0;padding:20px;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}.container{max-width:1200px;margin:0 auto}.canvas-container{border:2px solid #333;border-radius:10px;overflow:hidden;background:#000;position:relative;margin-top:20px}canvas{display:block;width:100%;height:75vh}.controls{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.8);padding:15px;border-radius:10px;border:1px solid rgba(255,255,255,.2);z-index:100;min-width:250px}.velocity-slider{width:100%;max-width:400px}.velocity-display{font-size:1.2em;color:#ff6b6b;font-weight:bold}.info-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px}.info-card{background:rgba(0,255,255,.1);padding:15px;border-radius:8px;border:1px solid rgba(0,255,255,.3)}.time-display{font-size:1.1em;color:#4ecdc4}.gamma-display{font-size:1.1em;color:#ffe66d}.note{font-size:.85em;color:#aaa;line-height:1.4}</style></head><body><div class="container"><h1>Special Relativity Simulation</h1><div class="canvas-container"><div class="controls"><label for="velocitySlider">Velocity (% of light speed):</label><input type="range" id="velocitySlider" class="velocity-slider" min="-95" max="95" value="0" step="1"><div class="velocity-display" id="velocityDisplay">0.00% c</div></div><canvas id="simulationCanvas" width="1200" height="600"></canvas></div><div class="info-panel"><div class="info-card"><h3>Your Time (Proper Time)</h3><div class="time-display" id="cameraTime">0.00 s</div></div><div class="info-card"><h3>Earth Coordinate Time</h3><div class="time-display" id="globalTime">0.00 s</div></div><div class="info-card"><h3>Lorentz Factor (γ)</h3><div class="gamma-display" id="gammaDisplay">1.000</div></div><div class="info-card"><h3>Measured Longitudinal Length</h3><div class="gamma-display" id="contractionDisplay">100.0%</div><div class="note">L/L₀ = 1/γ. Optical direction and Doppler shift use the received photon; retarded-event depth restores the spatial progression cue.</div></div></div></div><script>
class RelativitySimulation{constructor(){this.canvas=document.getElementById('simulationCanvas');this.ctx=this.canvas.getContext('2d',{alpha:false});this.slider=document.getElementById('velocitySlider');this.velocity=0;this.beta=0;this.gamma=1;this.c=300;this.properTime=0;this.earthTime=0;this.lastTime=performance.now();this.focalLength=400;this.halfWidth=this.canvas.width/2;this.halfHeight=this.canvas.height/2;this.tunnel=[];this.objects=[];this.initScene();this.slider.addEventListener('input',e=>{this.velocity=Number(e.target.value)/100;this.updatePhysics();this.updateDisplays()});this.updatePhysics();this.updateDisplays();this.animate()}
initScene(){for(let i=-10;i<=40;i++)this.tunnel.push({z:i*80,w:200,h:150});const ruler='#00ff88',marker='#ff4488',positions=[-800,-600,-400,-200,0,200,400,600,800,1000,1200,1400,1600,1800,2000];positions.forEach((z,i)=>{this.objects.push({type:'ruler',z,x:0,y:-75,length:120,color:ruler});this.objects.push({type:'ruler',z:z+100,x:0,y:75,length:100,color:ruler});if(i%2===0){this.objects.push({type:'ruler',z:z+50,x:-100,y:0,length:80,vertical:true,color:ruler});this.objects.push({type:'ruler',z:z+50,x:100,y:0,length:80,vertical:true,color:ruler})}if(i%3===0)this.objects.push({type:'marker',z,x:0,y:0,size:8,color:marker,label:`${z}m`})})}
updatePhysics(){this.beta=this.velocity;this.gamma=1/Math.sqrt(1-this.beta*this.beta)}
emissionTime(z,x,y){const T=this.earthTime,b=this.beta,c=this.c,A=c*c*(1-b*b),B=2*(b*c*z-c*c*T),C=c*c*T*T-(z*z+x*x+y*y),disc=Math.max(0,B*B-4*A*C),roots=[(-B+Math.sqrt(disc))/(2*A),(-B-Math.sqrt(disc))/(2*A)].filter(t=>t<=T+1e-9);return roots.length?Math.max(...roots):T}
observePoint(x,y,z){const te=this.emissionTime(z,x,y),oz=this.beta*this.c*te,dx=x,dy=y,dz=z-oz,r=Math.hypot(dx,dy,dz);if(r<1e-9)return null;const nx=-dx/r,ny=-dy/r,nz=-dz/r,den=1-this.beta*nz,npx=nx/(this.gamma*den),npy=ny/(this.gamma*den),npz=(nz-this.beta)/den,norm=Math.hypot(npx,npy,npz),depth=this.gamma*(z-this.beta*this.c*te);return{x:npx/norm,y:npy/norm,z:npz/norm,delta:this.gamma*den,te,depth}}
projectRay(ray){if(!ray||ray.depth<=1e-4)return null;return{x:this.halfWidth+this.focalLength*ray.x,y:this.halfHeight+this.focalLength*ray.y,scale:this.focalLength/ray.depth,depth:ray.depth}}
dopplerColor(hex,delta){const h=hex.slice(1),r0=parseInt(h.slice(0,2),16),g0=parseInt(h.slice(2,4),16),b0=parseInt(h.slice(4,6),16),s=Math.max(-1,Math.min(1,Math.log2(Math.max(delta,1e-6))/2));let r=r0,g=g0,b=b0;if(s>0){r*=1-.85*s;g*=1-.35*s;b+=(255-b)*.75*s}else{const q=-s;r+=(255-r)*.7*q;g*=1-.45*q;b*=1-.8*q}return`rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`}
toneMap(d){return Math.max(.12,Math.min(1,Math.pow(d,2)/(1+Math.pow(d,2))))}
render(){this.ctx.fillStyle='#000011';this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);this.renderTunnel();this.renderObjects()}
renderTunnel(){this.ctx.strokeStyle='#333';this.ctx.lineWidth=1;for(const s of this.tunnel){const pts=[[-s.w/2,-s.h/2,s.z],[s.w/2,-s.h/2,s.z],[s.w/2,s.h/2,s.z],[-s.w/2,s.h/2,s.z]].map(p=>this.projectRay(this.observePoint(...p)));if(pts.some(p=>!p))continue;this.ctx.beginPath();this.ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<4;i++)this.ctx.lineTo(pts[i].x,pts[i].y);this.ctx.closePath();this.ctx.stroke()}}
renderObjects(){const items=[];for(const o of this.objects){if(o.type==='ruler'){const a=this.projectRay(this.observePoint(o.x-(o.vertical?0:o.length/2),o.y-(o.vertical?o.length/2:0),o.z)),b=this.projectRay(this.observePoint(o.x+(o.vertical?0:o.length/2),o.y+(o.vertical?o.length/2:0),o.z)),ray=this.observePoint(o.x,o.y,o.z);if(a&&b&&ray)items.push({o,a,b,ray})}else{const ray=this.observePoint(o.x,o.y,o.z),p=this.projectRay(ray);if(p&&ray)items.push({o,p,ray})}}items.sort((a,b)=>b.ray.depth-a.ray.depth);for(const it of items)this.drawObject(it)}
drawObject(it){const{o,ray}=it;if(o.type==='ruler'){this.ctx.strokeStyle=this.dopplerColor(o.color,ray.delta);this.ctx.globalAlpha=this.toneMap(ray.delta);this.ctx.lineWidth=Math.max(1,Math.min(5,80/ray.depth*10));this.ctx.beginPath();this.ctx.moveTo(it.a.x,it.a.y);this.ctx.lineTo(it.b.x,it.b.y);this.ctx.stroke();this.ctx.globalAlpha=1;return}this.ctx.fillStyle=this.dopplerColor(o.color,ray.delta);this.ctx.globalAlpha=this.toneMap(ray.delta);const size=Math.max(2,Math.min(45,o.size*it.p.scale/10));this.ctx.beginPath();this.ctx.moveTo(it.p.x,it.p.y-size);this.ctx.lineTo(it.p.x+size,it.p.y);this.ctx.lineTo(it.p.x,it.p.y+size);this.ctx.lineTo(it.p.x-size,it.p.y);this.ctx.closePath();this.ctx.fill();if(size>5){this.ctx.font=`${Math.max(8,Math.min(18,size*1.4))|0}px Arial`;this.ctx.textAlign='center';this.ctx.fillText(o.label,it.p.x,it.p.y+size+14)}this.ctx.globalAlpha=1}
updateDisplays(){document.getElementById('velocityDisplay').textContent=`${(this.velocity*100).toFixed(2)}% c`;document.getElementById('gammaDisplay').textContent=this.gamma.toFixed(3);document.getElementById('contractionDisplay').textContent=`${(100/this.gamma).toFixed(1)}%`;document.getElementById('cameraTime').textContent=`${this.properTime.toFixed(2)} s`;document.getElementById('globalTime').textContent=`${this.earthTime.toFixed(2)} s`}
animate(){const now=performance.now(),dt=Math.min(.05,(now-this.lastTime)/1000);this.lastTime=now;this.properTime+=dt;this.earthTime+=dt*this.gamma;this.render();this.updateDisplays();requestAnimationFrame(()=>this.animate())}}
window.addEventListener('load',()=>new RelativitySimulation());</script></body></html>
